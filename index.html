<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>BOXE</title>
<style>
:root{
  --bg:#09090b;
  --panel:#141417;
  --panel2:#1d1d21;
  --red:#e31b23;
  --red-dark:#a90f15;
  --white:#f7f7f8;
  --muted:#8d8d96;
  --line:#2c2c31;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{margin:0;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% -15%,rgba(227,27,35,.22),transparent 34%),
    linear-gradient(180deg,#0b0b0d 0%,#08080a 100%);
}
.wrap{position:relative;max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.hero{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 18px}
.brand{display:flex;align-items:center;gap:13px}
.gloves{width:54px;height:54px;filter:drop-shadow(0 8px 18px rgba(227,27,35,.28))}
h1{margin:0;font-size:34px;line-height:1;font-weight:950;letter-spacing:1.5px}
.tagline{color:var(--muted);font-size:14px;margin-top:5px}
.live{font-size:11px;font-weight:850;letter-spacing:.8px;color:#fff;background:var(--red);padding:7px 10px;border-radius:999px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;background:#101012;padding:5px;border-radius:17px;border:1px solid #202024}
.tab{padding:13px;border:0;border-radius:12px;background:transparent;color:#a9a9b0;font-weight:850;font-size:16px}
.tab.on{background:var(--red);color:#fff;box-shadow:0 5px 18px rgba(227,27,35,.24)}
.card{background:linear-gradient(180deg,#17171a,#111114);border:1px solid #25252a;border-radius:27px;padding:22px;box-shadow:0 18px 50px #0008}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:12px;font-weight:900;letter-spacing:1.4px;color:#fff;background:#25252a;padding:7px 10px;border-radius:999px}
.round-kind{font-size:12px;font-weight:800;color:#ff777c}
#roundTitle{font-size:28px;font-weight:920;margin:12px 0 0;letter-spacing:-.6px}
.timerBox{position:relative;margin:18px 0 14px;padding:20px 12px 18px;border-radius:22px;background:#0d0d0f;border:1px solid #27272c;text-align:center;overflow:hidden}
.timerBox:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red),#ff656b)}
#timer{font-size:78px;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-4px;line-height:1}
.timerLabel{color:#707078;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:1.8px;margin-top:6px}
.cueBox{min-height:92px;background:#1b1b1f;border-left:4px solid var(--red);border-radius:14px;padding:15px 16px}
.cueLabel{font-size:10px;color:#ff676d;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:7px}
#cue{font-size:19px;line-height:1.3;color:#eeeeef;font-weight:650}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
button.ctrl{border:1px solid #303036;border-radius:16px;padding:15px 7px;font-size:15px;font-weight:850;background:#202024;color:#fff;min-height:54px}
button.ctrl:active{transform:scale(.98)}
button.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 22px rgba(227,27,35,.25)}
.rounds{display:flex;gap:8px;overflow-x:auto;padding:15px 0 3px;scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid #313137;padding:10px 13px;border-radius:999px;background:#17171a;color:#b9b9c0;font-weight:850;min-width:42px}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:390px){
 #timer{font-size:68px}
 button.ctrl{font-size:14px;padding:13px 5px}
 #roundTitle{font-size:25px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand">
      <svg class="gloves" viewBox="0 0 120 120" aria-hidden="true">
        <path fill="#e31b23" d="M18 27c8-14 25-19 37-8 8 7 9 20 4 30l-6 12 11 7-12 22-17-10-8 13-15-9 10-17-8-6c-9-7-6-24 4-34z"/>
        <path fill="#b80f16" d="M102 27c-8-14-25-19-37-8-8 7-9 20-4 30l6 12-11 7 12 22 17-10 8 13 15-9-10-17 8-6c9-7 6-24-4-34z"/>
        <path fill="#fff" opacity=".9" d="M28 63l23 14-6 10-23-14zm64 0L69 77l6 10 23-14z"/>
      </svg>
      <div><h1>BOXE</h1><div class="tagline">Allenamento guidato</div></div>
    </div>
    <div class="live">TRAINING</div>
  </div>

  <div class="tabs">
    <button class="tab on" id="day1">Giornata 1</button>
    <button class="tab" id="day2">Giornata 2</button>
  </div>

  <div class="card">
    <div class="topline">
      <div class="badge" id="roundLabel">ROUND 1</div>
      <div class="round-kind">3 MIN</div>
    </div>

    <div id="roundTitle"></div>

    <div class="timerBox">
      <div id="timer">03:00</div>
      <div class="timerLabel">tempo round</div>
    </div>

    <div class="cueBox">
      <div class="cueLabel">Guida</div>
      <div id="cue">Premi Avvia.</div>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev">⏮ Round</button>
      <button class="ctrl" id="back">−15 sec</button>
      <button class="ctrl" id="next">Round ⏭</button>
      <button class="ctrl" id="repeat">↻ Ripeti</button>
      <button class="ctrl primary" id="play">▶ Avvia</button>
      <button class="ctrl" id="fwd">+15 sec</button>
    </div>

    <div class="rounds" id="rounds"></div>
  </div>
</div>
<script src="workout-core.js"></script>
<script src="audio-intro.js"></script>
<script src="audio-cues.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }</script>
</body>
</html>
